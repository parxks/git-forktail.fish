name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax:
    name: Fish syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Check syntax
        shell: fish {0}
        run: |
          set -l fail 0
          for f in functions/*.fish completions/*.fish conf.d/*.fish
              printf 'checking %s\n' $f
              fish --no-execute $f
              or set fail 1
          end
          exit $fail

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: help / usage / version
        shell: fish {0}
        run: |
          for f in functions/*.fish
              source $f
          end
          ft --version
          ft --help  >/dev/null; and echo "help OK"
          ft --usage >/dev/null; and echo "usage OK"
